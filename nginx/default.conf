server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_min_length 1024;
  gzip_types text/css application/javascript application/json image/svg+xml;

  client_max_body_size 30m;

  # API de synchronisation : même origine que la PWA, donc pas de CORS.
  location /v1/ {
    proxy_pass http://notes-server:8080;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location = /health {
    proxy_pass http://notes-server:8080/health;
    proxy_set_header Host $host;
  }

  # Fichiers versionnés par Vite : cache long.
  location /assets/ {
    expires 1y;
    add_header Cache-Control 'public, immutable';
    try_files $uri =404;
  }

  # Service worker, manifeste et page d'entrée : toujours revalidés.
  location = /sw.js {
    add_header Cache-Control 'no-cache';
  }
  location = /registerSW.js {
    add_header Cache-Control 'no-cache';
  }
  location = /manifest.webmanifest {
    add_header Cache-Control 'no-cache';
  }
  location = /index.html {
    add_header Cache-Control 'no-cache';
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
