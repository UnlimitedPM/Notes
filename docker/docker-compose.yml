# Déploiement de l'image publiée (aucun build local).
# Usage : cd docker && cp .env.example .env && docker compose pull && docker compose up -d
name: notes

services:
  app:
    image: ghcr.io/unlimitedpm/notes:${IMAGE_TAG:-0.1.1}
    container_name: notes-app
    restart: unless-stopped
    environment:
      PORT: 8080
      DATA_DIR: /data
      STATIC_DIR: /app/public
      OIDC_ISSUER: ${OIDC_ISSUER:-}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-}
      OIDC_AUDIENCE: ${OIDC_AUDIENCE:-}
    volumes:
      - notes-data:/data
    ports:
      - '${APP_PORT:-8080}:8080'

volumes:
  notes-data:
    name: notes-data
