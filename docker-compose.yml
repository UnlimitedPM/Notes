services:
  notes-server:
    build: ./server
    container_name: notes-server
    restart: unless-stopped
    environment:
      PORT: 8080
      DATA_DIR: /data
      OIDC_ISSUER: ${OIDC_ISSUER:?renseigne OIDC_ISSUER dans .env}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:?renseigne OIDC_CLIENT_ID dans .env}
      CORS_ORIGIN: ${CORS_ORIGIN:-}
    volumes:
      - notes-data:/data
    ports:
      - '${NOTES_SERVER_PORT:-8080}:8080'
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:8080/health').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
        ]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  notes-data:
