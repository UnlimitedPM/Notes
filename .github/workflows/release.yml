name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  packages: write

jobs:
  frontend:
    name: Frontend (types, tests, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run build

  backend:
    name: Backend (types, tests, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run build

  image:
    name: Image Docker (GHCR)
    runs-on: ubuntu-latest
    needs: [frontend, backend]
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha
            type=raw,value=latest

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  release:
    name: GitHub Release
    runs-on: ubuntu-latest
    needs: [image]
    steps:
      - uses: actions/checkout@v4

      - name: Référence de l'image
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          body: |
            ## Déploiement

            Image unique (PWA et API dans le même conteneur) :

            ```bash
            docker pull ${{ env.IMAGE }}:${{ github.ref_name }}
            docker run -d -p 8080:8080 -v notes-data:/data \
              -e OIDC_ISSUER=https://sso.example.com/realms/mon-realm \
              -e OIDC_CLIENT_ID=notes-pwa \
              ${{ env.IMAGE }}:${{ github.ref_name }}
            ```

            Avec Compose (le service `app` pointe sur cette image) :

            ```bash
            IMAGE_TAG=${{ github.ref_name }} docker compose pull
            IMAGE_TAG=${{ github.ref_name }} docker compose up -d
            ```

            Le conteneur sert la PWA et l'API sur le même port (`8080`), les données
            vivent dans le volume `/data`.
